name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Prerender SEO gate (BUILD.md §5)
        run: |
          grep -q "Osei K. Prempeh" build/client/index.html
          grep -q "Immigration Law" build/client/index.html
          grep -q "(813)" build/client/index.html
          grep -q "application/ld+json" build/client/index.html
          ! grep -Eq "555-01[0-9]{2}|fonts.googleapis.com" build/client/index.html

      - run: npm audit --omit=dev

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
